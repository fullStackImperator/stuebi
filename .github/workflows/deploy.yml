# Builds the app image and puts it live on the school's server (docs/betrieb.md).
# Runs on every push to main; can also be started by hand under Actions → Deploy → Run workflow.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      break_healthcheck:
        description: "Test only: check a page that does not exist, so the rollback runs"
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/fullstackimperator/stuebi
  SERVER: deploy@188.68.38.203

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: SSH key for the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The build prerenders pages from the live database; it is reachable only through this tunnel.
      - name: Tunnel to the database
        run: ssh -fN -o ExitOnForwardFailure=yes -L 5432:127.0.0.1:5432 "$SERVER"

      # New tables and fields exist before the new version needs them; migrations only add, so the old one keeps running.
      - name: Migrate the database
        env:
          DATABASE_URL: ${{ secrets.BUILD_DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: npx payload migrate

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          network: host
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          build-args: NEXT_PUBLIC_SERVER_URL=${{ vars.SITE_URL }}
          secrets: |
            database_url=${{ secrets.BUILD_DATABASE_URL }}
            payload_secret=${{ secrets.PAYLOAD_SECRET }}

      - name: Put the new version live
        run: |
          scp deploy/compose.yml deploy/Caddyfile "$SERVER:/srv/stuebi/"
          ssh "$SERVER" "cd /srv/stuebi \
            && grep '^APP_TAG=' .env | cut -d= -f2 > .previous_tag \
            && sed -i 's/^APP_TAG=.*/APP_TAG=${{ github.sha }}/' .env \
            && docker compose pull app \
            && docker compose up -d app caddy \
            && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile"

      - name: Check the site, roll back if it fails
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CHECK_PATH: ${{ inputs.break_healthcheck && '/__rollback-test-page-does-not-exist' || '/' }}
        run: |
          if curl -fsS -o /dev/null --retry 12 --retry-delay 5 --retry-all-errors "$SITE_URL$CHECK_PATH"; then
            echo "live: ${{ github.sha }}"
            exit 0
          fi
          echo "::error::$SITE_URL$CHECK_PATH did not answer 200 – rolling back"
          ssh "$SERVER" 'cd /srv/stuebi \
            && sed -i "s/^APP_TAG=.*/APP_TAG=$(cat .previous_tag)/" .env \
            && docker compose up -d app'
          exit 1
