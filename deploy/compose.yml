# The website on the school's own server, in /srv/stuebi (docs/betrieb.md).
# Values come from /srv/stuebi/.env, which exists only on the server (template: deploy/env.example).
name: stuebi

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: stuebi
      POSTGRES_USER: stuebi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Only on the server itself: the GitHub build reaches it through an SSH tunnel, the internet never does.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stuebi -d stuebi"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/fullstackimperator/stuebi:${APP_TAG:?set in .env}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://stuebi:${POSTGRES_PASSWORD}@postgres:5432/stuebi
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set in .env}
    # Uploads stay on the server across new images.
    volumes:
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    # No ports: only Caddy talks to the app, so the client IP in X-Forwarded-For can be trusted (docs/security.md).

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
